[package]
name = "newseum"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
async-channel = "2"
chrono = "0.4"
csv = "1"
feed-rs = "3"
gst = { version = "0.25", package = "gstreamer" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
scraper = "0.29"
ureq = "3"
url = "2"
